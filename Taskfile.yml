version: '3'

vars:
  APP_NAME: guitarists
  BIN_DIR: bin
  BIN_NAME: '{{.APP_NAME}}{{if eq OS "windows"}}.exe{{end}}'
  LD_FLAGS: '{{if eq OS "windows"}}-w -s -H windowsgui{{else}}-w -s{{end}}'

tasks:
  install:
    desc: Installs frontend dependencies
    dir: frontend
    cmds:
      - npm install

  frontend:
    desc: Builds the frontend
    dir: frontend
    deps: [install]
    cmds:
      - npm run build

  build:
    desc: Builds the production application
    deps: [frontend]
    cmds:
      - go build -trimpath -buildvcs=false -tags production -ldflags="{{.LD_FLAGS}}" -o {{.BIN_DIR}}/{{.BIN_NAME}} .

  dev:
    desc: Runs the application with hot reload
    cmds:
      - wails3 dev -config ./build/config.yml

  run:
    desc: Runs the built application
    cmds:
      - ./{{.BIN_DIR}}/{{.BIN_NAME}}

  test:
    desc: Runs Go tests
    cmds:
      - go test ./...

  vet:
    desc: Runs Go static analysis
    cmds:
      - go vet ./...

